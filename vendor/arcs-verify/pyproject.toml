[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arcs-verify"
version = "0.1.1"
description = "Independent verifier for signed ARCS/SRS receipts and serialized artifact chains"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Vega Commons Project, Inc." }]
keywords = ["arcs", "srs", "receipt", "verification", "ed25519", "jcs", "rfc8785"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "cryptography>=46.0.4,<47",
  "rfc8785==0.1.4",
  "jsonschema>=4.26,<5",
]

[project.urls]
Repository = "https://github.com/thelaplage/arcs-verify"
Issues = "https://github.com/thelaplage/arcs-verify/issues"

[project.scripts]
arcs-verify = "arcs_verify.cli:main"

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
include = ["arcs_verify*"]

[tool.setuptools.package-data]
arcs_verify = [
  "data/*.json",
  "contracts/dagr-srs-verification-report-v0-1/*.json",
  "contracts/dagr-srs-verification-report-v0-1/*.md",
  "contracts/dagr-srs-verification-report-v0-1/golden/*.json",
  "contracts/dagr-srs-verification-report-v0-2/*.json",
  "contracts/dagr-srs-verification-report-v0-2/*.md",
  "contracts/dagr-srs-verification-report-v0-2/input-fixtures/*.json",
  "contracts/dagr-srs-verification-report-v0-2/input-fixtures/*.md",
  # The authoritative v0.2 goldens, generated by the post-merge closure PR
  # against implementation squash-merge commit c26af32, plus the digest
  # manifest that pins them (matched by the contract-root *.json glob above).
  "contracts/dagr-srs-verification-report-v0-2/golden/*.json",
]
